<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<table>
  <!-- 1. Header: Describes what each column contains -->
  <thead>
    <tr>
      <th>Item</th>
      <th>Category</th>
      <th>Cost</th>
    </tr>
  </thead>

  <!-- 2. Body: Holds your 4 rows of information -->
  <tbody>
    <tr>
      <td>Internet Bill</td>
      <td>Utilities</td>
      <td>$60</td>
    </tr>
    <tr>
      <td>Groceries</td>
      <td>Food</td>
      <td>$150</td>
    </tr>
    <tr>
      <td>Bus Pass</td>
      <td>Transport</td>
      <td>$45</td>
    </tr>
    <tr>
      <td>Coffee</td>
      <td>Food</td>
      <td>$25</td>
    </tr>
  </tbody>

  <!-- 3. Footer: Optional summary or final calculation -->
  <tfoot>
    <tr>
      <!-- colspan="2" makes this cell take up the first two columns -->
      <td colspan="2">Total Expenses</td>
      <td>$280</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
